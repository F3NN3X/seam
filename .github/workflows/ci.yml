name: CI

# A pull request checks the change. A push to main (one per merge) also builds
# the release exes and saves the Rust cache, which every pull request restores:
# a cache saved by a pull request is only ever read by that pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request replaces the run. Runs on main queue.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Both crates are on one version
        shell: bash
        run: |
          a=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          b=$(grep -m1 '^version' settings/Cargo.toml | cut -d'"' -f2)
          [ "$a" = "$b" ] || { echo "seam is $a but seam-settings is $b"; exit 1; }
      # About and diagnostics show it. Local builds say "dev".
      - name: Short build id
        shell: bash
        run: echo "SEAM_BUILD=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Catches a break that only the release profile shows, once per merge.
      - if: github.event_name == 'push'
        run: cargo build --release --workspace
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seam
          path: |
            target/release/seam.exe
            target/release/seam-settings.exe
          if-no-files-found: error
      # A broken seam.iss shows up at merge time, not at tag time. The setup is
      # only kept as an artifact for testing, and goes nowhere else.
      - name: Install Inno Setup
        if: github.event_name == 'push'
        shell: pwsh
        run: ./packaging/install-inno.ps1
      - name: Build installer
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $id = (Get-Content packaging/installer.json -Raw | ConvertFrom-Json).app_id
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/seam.exe, target/release/seam-settings.exe dist
          & $env:ISCC "/DAppVersion=$version" "/DAppId=$id" "/DSourceDir=$PWD\dist" "/O$PWD\dist" packaging\seam.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: dist/Seam-Setup-*.exe
          retention-days: 3
          if-no-files-found: error
