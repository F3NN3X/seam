name: CI

# A pull request checks the change, and that run is the proof for its merge.
# Main runs only to refresh the Rust cache that every pull request restores (a
# cache saved by a pull request is only ever read by that pull request): when a
# merge changes what the cache is keyed on or the packaging, once a week for
# runner toolchain updates, or by hand. Those runs also build the release exes
# and the setup, so a break that only they show turns up before a tag.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - settings/Cargo.toml
      - packaging/**
      - .github/workflows/ci.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run. Runs on main queue.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Both crates are on one version
        shell: bash
        run: |
          a=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          b=$(grep -m1 '^version' settings/Cargo.toml | cut -d'"' -f2)
          [ "$a" = "$b" ] || { echo "seam is $a but seam-settings is $b"; exit 1; }
      # About and diagnostics show it. Local builds say "dev".
      - name: Short build id
        shell: bash
        run: echo "SEAM_BUILD=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Catches a break that only the release profile shows.
      - if: github.event_name != 'pull_request'
        run: cargo build --release --workspace
      # A broken seam.iss shows up before a tag. Nothing keeps the setup.
      - name: Install Inno Setup
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/install-inno.ps1
      - name: Build installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $id = (Get-Content packaging/installer.json -Raw | ConvertFrom-Json).app_id
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/seam.exe, target/release/seam-settings.exe dist
          & $env:ISCC "/DAppVersion=$version" "/DAppId=$id" "/DSourceDir=$PWD\dist" "/O$PWD\dist" packaging\seam.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # A cross build on the x64 runner. The tests can't run on ARM64 here, and the
  # code they cover is the same on both, so this only has to compile and lint.
  # Required next to `build`, by the ruleset and the release gate.
  arm64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup target add aarch64-pc-windows-msvc
      # ring compiles its C and assembly for ARM64 with clang only. The runner
      # ships LLVM, and this makes sure it's on PATH.
      - name: Clang on PATH
        shell: bash
        run: echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
      - run: clang --version
      - name: Short build id
        shell: bash
        run: echo "SEAM_BUILD=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets --target aarch64-pc-windows-msvc -- -D warnings
      - if: github.event_name == 'pull_request'
        run: cargo build --workspace --target aarch64-pc-windows-msvc
      - if: github.event_name != 'pull_request'
        run: cargo build --release --workspace --target aarch64-pc-windows-msvc

  # The Stream Deck plugin, from its lockfile, with the scripts it defines. Runs
  # on every change: it takes about a minute, and a paths filter would need an
  # extra action for a check nothing is waiting on.
  streamdeck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/streamdeck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: integrations/streamdeck/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # The Elgato CLI from the lockfile, so its version is pinned there.
      - run: pnpm validate
