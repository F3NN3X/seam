# Drafts a GitHub release on a version tag. A person publishes it. `gate` first
# checks the versions, takes the notes from this version's CHANGELOG.md section,
# and checks that CI passed for the tagged commit, or for the pull request that
# merged it, so tests aren't run again here. The release fails unless the
# `release` environment holds MINISIGN_SECRET_KEY (the full contents of the
# minisign secret key file) and MINISIGN_PASSWORD, because the updater ignores
# an unsigned release. That environment needs a required reviewer, so a workflow edited on another
# branch can't reach the key. Setting it up is in packaging/README.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A second tag waits for the first. A cancelled release can leave half a draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in Cargo.toml settings/Cargo.toml; do
            v=$(grep -m1 '^version' "$f" | cut -d'"' -f2)
            [ "$v" = "$tag" ] || { echo "::error::$f is $v, tag is $tag"; exit 1; }
          done

      # The notes are this version's section, from its heading to the next one.
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next } found' CHANGELOG.md > notes.md
          grep -q '^- ' notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          retention-days: 1

      # A squash merge makes a new commit, so its own run on main may still be going.
      # The pull request's head passed the same checks, so either one counts.
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An API error counts as "not green", so the gate fails closed. Every
          # check main requires has to have passed: the x64 build and the ARM64 one.
          green() {
            local check n
            for check in build arm64; do
              n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$1/check-runs?check_name=$check" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=0
              if [ "${n:-0}" -eq 0 ]; then echo 0; return; fi
            done
            echo 1
          }
          if [ "$(green "$GITHUB_SHA")" -gt 0 ]; then echo "CI passed on $GITHUB_SHA"; exit 0; fi
          heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls"             --jq '.[] | select(.merged_at != null) | .head.sha' 2>/dev/null) || heads=""
          for head in $heads; do
            if [ "$(green "$head")" -gt 0 ]; then echo "CI passed on $head, the pull request that merged $GITHUB_SHA"; exit 0; fi
          done
          echo "::error::No passing CI build for $GITHUB_SHA or the pull request that merged it"
          exit 1

  release:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - name: The signing key is set
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY isn't set in the release environment, and the updater ignores unsigned releases"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes

      - name: Short build id
        shell: bash
        run: echo "SEAM_BUILD=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - run: cargo build --release --workspace

      # A cross build on this x64 runner. ring compiles for ARM64 with clang only,
      # which the runner ships.
      - name: Build for ARM64
        shell: bash
        run: |
          rustup target add aarch64-pc-windows-msvc
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          clang --version
          cargo build --release --workspace --target aarch64-pc-windows-msvc

      # dist\ holds what's uploaded. A release asset name is unique, so the ARM64
      # exes go up as seam-arm64.exe and seam-settings-arm64.exe, and dist-arm64\
      # holds them under their own names for the zip and the setup.
      - name: Manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          mkdir dist dist-arm64
          cp target/release/seam.exe target/release/seam-settings.exe dist/
          cp target/aarch64-pc-windows-msvc/release/seam.exe target/aarch64-pc-windows-msvc/release/seam-settings.exe dist-arm64/
          cp dist-arm64/seam.exe dist/seam-arm64.exe
          cp dist-arm64/seam-settings.exe dist/seam-settings-arm64.exe
          pre=false; [[ "$tag" == *-* ]] && pre=true
          python - "$tag" "$pre" <<'PY'
          import hashlib, json, os, sys, datetime
          tag, pre = sys.argv[1], sys.argv[2] == "true"
          # The panel shows the first few lines, so it gets the bullets without the headings.
          notes = "\n".join(l.rstrip() for l in open("notes.md", encoding="utf-8") if l.startswith("- "))
          def entry(name, asset):
              return {"name": name, "asset": asset, "size": os.path.getsize(f"dist/{asset}"),
                      "sha256": hashlib.sha256(open(f"dist/{asset}", "rb").read()).hexdigest()}
          # Keyed like Rust's std::env::consts::ARCH, which the updater looks itself up by.
          arches = {arch: [entry(n, n.replace(".exe", f"{suffix}.exe")) for n in ("seam.exe", "seam-settings.exe")]
                    for arch, suffix in (("x86_64", ""), ("aarch64", "-arm64"))}
          # `files` is exactly what updaters from before ARM64 builds read: the x64 exes.
          files = [{k: f[k] for k in ("name", "size", "sha256")} for f in arches["x86_64"]]
          json.dump({"version": tag, "date": datetime.date.today().isoformat(), "prerelease": pre,
                     "notes": notes.strip(), "files": files, "arches": arches},
                    open("dist/latest.json", "w"), indent=2)
          PY

      - name: Install minisign
        shell: pwsh
        run: |
          foreach ($try in 1..3) {
            choco install minisign --version 0.8.0 --no-progress -y
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (10 * $try)
          }
          exit 1

      - name: Sign manifest
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/seam.key"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/seam.key"
          # -H prehashes. minisign 0.8 doesn't by default, and the updater refuses the legacy kind.
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -H -s "$RUNNER_TEMP/seam.key" -m dist/latest.json

      - name: Zip for manual download
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path dist/seam.exe, dist/seam-settings.exe, README.md, LICENSE -DestinationPath "dist/seam-$version-windows-x64.zip"
          Compress-Archive -Path dist-arm64/seam.exe, dist-arm64/seam-settings.exe, README.md, LICENSE -DestinationPath "dist/seam-$version-windows-arm64.zip"

      # Inno Setup 7 isn't on Chocolatey, so this takes the official release at a
      # pinned version and SHA-256, and ignores any Inno the runner already has.
      - name: Install Inno Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/install-inno.ps1

      # Built from dist\ and dist-arm64\, the files latest.json hashes. The setups
      # aren't added to latest.json, because the updater only stages the two exes.
      - name: Build installers
        shell: pwsh
        run: |
          $id = (Get-Content packaging/installer.json -Raw | ConvertFrom-Json).app_id
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & $env:ISCC "/DAppVersion=$version" "/DAppId=$id" "/DSourceDir=$PWD\dist" "/O$PWD\dist" packaging\seam.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $env:ISCC "/DAppVersion=$version" "/DAppId=$id" "/DArch=arm64" "/DSourceDir=$PWD\dist-arm64" "/O$PWD\dist" packaging\seam.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The zips, the setups and the Store package all hold the exes latest.json
      # hashes: the uploaded asset and, for ARM64, the copy the zip and setup took.
      - name: The exes are still the ones latest.json hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, sys
          manifest = json.load(open("dist/latest.json"))
          staged = {"x86_64": "dist", "aarch64": "dist-arm64"}
          checks = [(f["name"], f"dist/{f['name']}", f["sha256"]) for f in manifest["files"]]
          checks += [(f["asset"], path, f["sha256"]) for arch, files in manifest["arches"].items() for f in files
                     for path in (f"dist/{f['asset']}", f"{staged[arch]}/{f['name']}")]
          bad = sorted({name for name, path, sha in checks
                        if hashlib.sha256(open(path, "rb").read()).hexdigest() != sha})
          if bad:
              print(f"::error::{', '.join(bad)} changed after latest.json was written")
              sys.exit(1)
          PY

      # A draft only. Publishing is a person's click.
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--draft"; [[ "$GITHUB_REF_NAME" == *-* ]] && flags="$flags --prerelease"
          gh release create "$GITHUB_REF_NAME" $flags --notes-file notes.md dist/*
