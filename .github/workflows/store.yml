# Uploads a Microsoft Store DRAFT with the msstore CLI, then commits it to
# certification. Both the upload and the commit wait for approval through the
# `store` environment. Going live stays a manual "Publish now" in Partner
# Center. The first submission can't be automated, so run this from the second
# release on. The secrets live in the `store` environment only. Setting them up
# is in packaging/README.md.
name: Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (must match Cargo.toml, e.g. 0.2.1)"
        required: true

permissions:
  contents: read

# A second run waits for the first. A cancelled upload can leave a half-made submission.
concurrency:
  group: store
  cancel-in-progress: false

jobs:
  pack:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Store gets the exes the published release holds, so it can't differ
      # from the GitHub version. Nothing is built here.
      - name: Install minisign
        shell: pwsh
        run: |
          foreach ($try in 1..3) {
            choco install minisign --version 0.8.0 --no-progress -y
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (10 * $try)
          }
          exit 1
      # Only a published release, signed with Seam's key, listing exactly the two exes.
      - name: Download and check the release's exes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          draft=$(gh release view "v$VERSION" --json isDraft --jq .isDraft)
          [ "$draft" = "false" ] || { echo "::error::v$VERSION is a draft. Publish it first"; exit 1; }
          mkdir release
          gh release download "v$VERSION" -D release -p seam.exe -p seam-settings.exe -p latest.json -p latest.json.minisig
          key=$(grep -m1 'pub const SEAM_PUBLIC_KEY' settings/src/update.rs | cut -d'"' -f2)
          minisign -Vm release/latest.json -P "$key"
          python - "$VERSION" <<'PY'
          import hashlib, json, sys
          manifest = json.load(open("release/latest.json"))
          if manifest["version"] != sys.argv[1]:
              sys.exit(f"::error::latest.json is for {manifest['version']}, not {sys.argv[1]}")
          names = sorted(f["name"] for f in manifest["files"])
          if names != ["seam-settings.exe", "seam.exe"]:
              sys.exit(f"::error::latest.json lists {names}, not exactly the two exes")
          bad = [f["name"] for f in manifest["files"]
                 if hashlib.sha256(open(f"release/{f['name']}", "rb").read()).hexdigest() != f["sha256"]]
          if bad:
              sys.exit(f"::error::{', '.join(bad)} doesn't match latest.json")
          PY
      - name: Pack the unsigned -store.msix
        shell: pwsh
        env:
          EXPECT_VERSION: ${{ inputs.version }}
        run: ./packaging/pack-msix.ps1 -ExpectVersion $env:EXPECT_VERSION -From release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-msix
          path: dist/*-store.msix
          if-no-files-found: error

  upload:
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 45
    environment: store # approval 1 of 2
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-msix
          path: dist
      - name: Set up msstore
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1
      - name: Configure msstore
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: msstore reconfigure --tenantId "$env:TENANT_ID" --sellerId "$env:SELLER_ID" --clientId "$env:CLIENT_ID" --clientSecret "$env:CLIENT_SECRET"
      - name: Upload as a draft, without committing
        shell: pwsh
        env:
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
        run: |
          $msix = Get-ChildItem dist/*-store.msix | Select-Object -First 1
          msstore publish $msix.FullName --appId "$env:STORE_APP_ID" --noCommit
          msstore submission status "$env:STORE_APP_ID"

  commit:
    needs: upload
    runs-on: windows-latest
    timeout-minutes: 45
    environment: store # approval 2 of 2, after looking at the draft. Never edit it in the web UI
    steps:
      - name: Set up msstore
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1
      - name: Configure msstore
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: msstore reconfigure --tenantId "$env:TENANT_ID" --sellerId "$env:SELLER_ID" --clientId "$env:CLIENT_ID" --clientSecret "$env:CLIENT_SECRET"
      - name: Commit to certification
        shell: pwsh
        env:
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
        run: msstore submission publish "$env:STORE_APP_ID"
